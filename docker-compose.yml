services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      # Required — the official mariadb image refuses to start without a root
      # password (or an explicit opt-in to an empty one, which we don't want here).
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      MYSQL_DATABASE: ${DB_NAME:-hargeisa_tax_db}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      DB_NAME: ${DB_NAME:-hargeisa_tax_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      JWT_EXPIRES_IN: 8h
      COOKIE_NAME: htax_token
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in your .env file}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hargeisatax.gov.so}
      SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-System Administrator}
      MYSQLDUMP_BIN: mysqldump
      MYSQL_BIN: mysql
    volumes:
      - server-uploads:/app/uploads
      - server-backups:/app/backups

  client:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  db-data:
  server-uploads:
  server-backups:
